name: Dependabot agent

on:
  workflow_call:
    inputs:
      pr_number:
        description: Run on this existing Dependabot PR instead of the triggering event
        type: string
        required: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false

jobs:
  agent:
    if: >-
      inputs.pr_number != '' ||
      (github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: dep-agent-${{ github.repository }}-${{ inputs.pr_number || github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      AGENT_DIR: ${{ github.workspace }}/.dependabot-agent/dependabot-agent
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve PR
        env:
          INPUT_PR: ${{ inputs.pr_number }}
        run: |
          if [ -n "$INPUT_PR" ]; then
            pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$INPUT_PR")
          else
            pr=$(jq .pull_request "$GITHUB_EVENT_PATH")
          fi
          if [ "$(jq -r .user.login <<<"$pr")" != "dependabot[bot]" ] || [ "$(jq -r .state <<<"$pr")" != "open" ]; then
            echo "::error::PR #$(jq -r .number <<<"$pr") is not an open Dependabot PR"
            exit 1
          fi
          eof=$(openssl rand -hex 8)
          {
            echo "PR_NUMBER=$(jq -r .number <<<"$pr")"
            echo "HEAD_SHA=$(jq -r .head.sha <<<"$pr")"
            echo "HEAD_REF=$(jq -r .head.ref <<<"$pr")"
            echo "PR_TITLE=$(jq -r .title <<<"$pr")"
            echo "PR_BODY<<$eof"
            jq -r '.body // ""' <<<"$pr"
            echo "$eof"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          repository: TruFin-io/.github
          ref: ${{ github.job_workflow_sha || 'main' }}
          path: .dependabot-agent
          sparse-checkout: dependabot-agent
          persist-credentials: false

      - run: echo ".dependabot-agent/" >> .git/info/exclude

      - uses: actions/setup-node@v6
        if: hashFiles('.nvmrc') != ''
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-node@v6
        if: hashFiles('.nvmrc') == ''
        with:
          node-version: lts/*

      - uses: oven-sh/setup-bun@v2
        if: hashFiles('**/bun.lock', '**/bun.lockb') != ''

      - run: corepack enable

      - id: check
        name: Run checks
        run: python3 "$AGENT_DIR/agent.py" check --agent-dir "$AGENT_DIR"

      - id: claude
        name: Claude
        if: steps.check.outputs.needs_claude == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: dependabot[bot]
          prompt: ${{ steps.check.outputs.prompt }}
          claude_args: ${{ steps.check.outputs.claude_args }}

      - id: recheck
        name: Re-run checks and guardrails
        if: steps.check.outputs.needs_claude == 'true'
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: python3 "$AGENT_DIR/agent.py" recheck --execution-file "$EXECUTION_FILE"

      - name: Push fix
        if: steps.recheck.outputs.push == 'true'
        env:
          PUSH_TOKEN: ${{ steps.claude.outputs.github_token }}
        run: python3 "$AGENT_DIR/agent.py" push

      - name: Report
        if: always() && env.HEAD_SHA != '' && steps.check.outputs.proceed != 'false'
        run: python3 "$AGENT_DIR/agent.py" report
